<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6f8fad" />
    <meta name="description" content="Assist — local time and weather for the places you work with." />
    <title>Assist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sky__glow"></div>
      <div class="sky__haze"></div>
    </div>

    <header class="hero">
      <p class="brand">Assist</p>
      <h1 class="headline">Your places, local time, and weather.</h1>
      <p class="lede">A light daily desk for the cities you work across.</p>

      <form class="add-place" id="add-place-form" autocomplete="off">
        <label class="sr-only" for="place-query">Add a place</label>
        <input
          id="place-query"
          name="query"
          type="search"
          enterkeyhint="search"
          placeholder="Add a city or place"
          required
          maxlength="80"
        />
        <button type="submit" id="add-place-btn">Add</button>
        <ul class="suggestions" id="suggestions" hidden role="listbox" aria-label="Place suggestions"></ul>
      </form>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </header>

    <main class="places" id="places" aria-live="polite"></main>

    <footer class="foot">
      <p>Weather via Open-Meteo · Times update live</p>
    </footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
