name: Build Assist.exe

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows one-file exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Assist.exe
        run: python -m PyInstaller --noconfirm --clean Assist.spec

      - name: Stage Release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Release | Out-Null
          Copy-Item dist\Assist.exe Release\Assist.exe -Force
          Copy-Item "scripts\Run Assist.bat" "Release\Run Assist.bat" -Force
          @(
            'Assist — double-click Assist.exe to run.',
            '',
            'First launch can take a few seconds.',
            'If Windows SmartScreen appears: More info -> Run anyway.',
            'Places and alerts are saved under %USERPROFILE%\.assist\'
          ) | Set-Content -Path Release\README.txt

      - name: Upload Assist.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Assist-windows
          path: Release/
          if-no-files-found: error
